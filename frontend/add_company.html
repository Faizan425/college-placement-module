<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Company | Admin</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; display: flex; }
        
        
        .sidebar { width: 250px; background-color: #2c3e50; color: white; height: 100vh; position: fixed; padding-top: 20px; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; }
        .menu-item { display: block; padding: 15px 20px; color: #bdc3c7; text-decoration: none; transition: 0.3s; }
        .menu-item:hover, .active { background-color: #34495e; color: white; border-left: 4px solid #3498db; }
        
        .content { margin-left: 250px; padding: 40px; width: 100%; }

        
        .form-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        
        
        .divider { grid-column: span 2; border-bottom: 2px solid #eee; margin: 20px 0; padding-bottom: 5px; color: #3498db; font-weight: bold; }

        button { width: 100%; padding: 15px; background-color: #27ae60; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #219150; }
        
        .loading { opacity: 0.7; cursor: wait; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Admin Console</h2>
        <a href="/api/admin/admin_dashboard" class="menu-item">Dashboard & Stats</a>
        <a href="#" class="menu-item active">Add Company</a>
        <a href="#" class="menu-item" onclick="logout()">Logout</a>
    </div>

    <div class="content">
        <div class="form-card">
            <h1>Launch Placement Drive</h1>
            <form id="company-form">
                
                <div class="form-grid">
                    <div class="divider">Step 1: Company Details</div>
                    
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="name" placeholder="e.g. Google" required>
                    </div>
                    <div class="form-group">
                        <label>Job Position/Role</label>
                        <input type="text" id="position" placeholder="e.g. SDE-1" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Annual Package (INR)</label>
                        <input type="number" id="salary" placeholder="e.g. 1500000" required>
                        <small style="color:#888;">Used for the 'Salary Upgrade' logic</small>
                    </div>
                    <div class="form-group full-width">
                        <label>Job Description</label>
                        <textarea id="description" rows="3"></textarea>
                    </div>

                    <div class="divider">Step 2: Eligibility Criteria (The Filters)</div>

                    <div class="form-group">
                        <label>Minimum CGPA</label>
                        <input type="number" step="0.01" id="min_cgpa" value="6.0" required>
                    </div>
                    <div class="form-group">
                        <label>Minimum Academic Year</label>
                        <select id="min_year">
                            <option value="4" selected>4th Year Only</option>
                            <option value="3">3rd Year & Above</option>
                            <option value="1">All Years</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Max Standing Arrears</label>
                        <input type="number" id="max_standing" value="0" required>
                    </div>
                    <div class="form-group">
                        <label>History of Arrears Allowed?</label>
                        <select id="history_arrears">
                            <option value="true" selected>Yes, Allowed</option>
                            <option value="false">No, Must be Clean History</option>
                        </select>
                    </div>
                </div>

                <br>
                <button type="submit" id="submit-btn">Add Company & Notify Students</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('company-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');

            
            btn.classList.add('loading');
            btn.innerText = "Processing & Sending Emails...";
            btn.disabled = true;

            
            const payload = {
                name: document.getElementById('name').value,
                position_role: document.getElementById('position').value,
                salary: parseFloat(document.getElementById('salary').value),
                description: document.getElementById('description').value,
                // Constraints
                min_cgpa: parseFloat(document.getElementById('min_cgpa').value),
                min_year: parseInt(document.getElementById('min_year').value),
                max_standing_arrears: parseInt(document.getElementById('max_standing').value),
                history_arrears: document.getElementById('history_arrears').value === 'true'
            };

            try {
                
                const res = await fetch('/api/admin/add-company', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    alert("Success! " + data.message);
                    window.location.href = '/api/admin/admin_dashboard';
                } else {
                    alert("Error: " + data.message);
                    resetBtn();
                }
            } catch (err) {
                console.error(err);
                alert("Server Connection Failed");
                resetBtn();
            }
        });

        function resetBtn() {
            const btn = document.getElementById('submit-btn');
            btn.classList.remove('loading');
            btn.innerText = "Add Company & Notify Students";
            btn.disabled = false;
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
