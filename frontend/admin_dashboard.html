<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; display: flex; }
        
        
        .sidebar { width: 250px; background-color: #2c3e50; color: white; height: 100vh; position: fixed; padding-top: 20px; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; }
        .menu-item { display: block; padding: 15px 20px; color: #bdc3c7; text-decoration: none; transition: 0.3s; }
        .menu-item:hover, .active { background-color: #34495e; color: white; border-left: 4px solid #3498db; }
        
        
        .content { margin-left: 250px; padding: 30px; width: 100%; }
        
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .stat-num { font-size: 2.5em; font-weight: bold; color: #2980b9; margin: 10px 0; }
        .stat-label { color: #7f8c8d; }

        
        .chart-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); height: 400px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Admin Console</h2>
        <a href="#" class="menu-item active">Dashboard & Stats</a>
        <a href="/add_company.html" class="menu-item">Add Company</a>
        <a href="#" class="menu-item" onclick="logout()">Logout</a>
    </div>

    <div class="content">
        <h1>Placement Overview</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Average Package</div>
                <div class="stat-num" id="avg-pkg">₹ 0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Placed</div>
                <div class="stat-num" id="placed-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unplaced Students</div>
                <div class="stat-num" id="unplaced-count">0</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="placementChart"></canvas>
        </div>
    </div>

    <script>
        // Fetch Stats on Load
        window.onload = async () => {
            try {
                const res = await fetch('/api/admin/stats');
                if (res.status === 401) window.location.href = '/admin_login.html';
                
                const data = await res.json();
                renderDashboard(data);
            } catch (err) {
                console.error("Stats Error:", err);
            }
        };

        function renderDashboard(data) {
            
            document.getElementById('avg-pkg').innerText = "₹ " + Math.round(data.avgPackage).toLocaleString();
            document.getElementById('placed-count').innerText = data.placedCount;
            document.getElementById('unplaced-count').innerText = data.unplacedCount;

            
            const ctx = document.getElementById('placementChart').getContext('2d');
            
            const labels = data.companyDist.map(item => item._id);
            const counts = data.companyDist.map(item => item.count);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '# of Students Placed',
                        data: counts,
                        backgroundColor: '#3498db',
                        borderColor: '#2980b9',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
